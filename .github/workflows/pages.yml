name: Stock Screener GitHub Pages

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-screener-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps for curl_cffi
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test
        run: python main.py --dry-run --site-output --no-feishu

      - name: Run stock screener
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python main.py --site-output

      - name: Clean old cache
        run: python scripts/clean_cache.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data
          git commit -m "update stock screener data" || echo "No changes"
          git pull --rebase origin main && git push || echo "Push failed (likely conflict), data is in artifact"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4